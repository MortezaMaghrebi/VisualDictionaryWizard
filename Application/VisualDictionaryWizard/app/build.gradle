plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.codestoon.visualdictionarywizard'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.codestoon.visualdictionarywizard"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.3"

        //testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "store"
    productFlavors {
        myket {
            dimension "store"
            //applicationId "com.codestoon.koodakboom.myket"  // پکیج متفاوت
            versionNameSuffix "-myket"

            // تنظیمات مایکت
            def marketApplicationId = "ir.mservices.market"
            def marketBindAddress = "ir.mservices.market.InAppBillingService.BIND"
            manifestPlaceholders = [
                    marketApplicationId: "${marketApplicationId}",
                    marketBindAddress: "${marketBindAddress}",
                    marketPermission: "${marketApplicationId}.BILLING"
            ]
            buildConfigField "String", "IAB_PUBLIC_KEY", "\"MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCmF7QkVu7ERXP/xg6LftwWbSaAmjCmxwQy0qNdAHQSESnndIxTASH+MDNvk+5hOpgABwJaw+99Kie14ZlOPG9C7oVo1FrH81h6OoL0Sf2LaESjGV8bm9wujCswNWXVk4fvmUOkHcBlMLFEa2IV1bY+7B6y0NtcFBoQ8Mu4+knZyQIDAQAB\""
            buildConfigField "String", "STORE_NAME", "\"myket\""
        }

        bazaar {
            dimension "store"
            // applicationId "com.codestoon.koodakboom.bazaar"  // پکیج متفاوت
            versionNameSuffix "-bazaar"

            // تنظیمات بازار
            def marketApplicationId = "com.farsitel.bazaar"
            def marketBindAddress = "ir.cafebazaar.pardakht.InAppBillingService.BIND"
            manifestPlaceholders = [
                    marketApplicationId: "${marketApplicationId}",
                    marketBindAddress: "${marketBindAddress}",
                    marketPermission: "com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR"
            ]
            buildConfigField "String", "IAB_PUBLIC_KEY", "\"MIHNMA0GCSqGSIb3DQEBAQUAA4G7ADCBtwKBrwCmp2ebUhdy8e/n1XJs0AwzDCCLt4PjmfW3s0Dx8K9l8GZTGKT9PTEq2GNxHdYHmfropwNYgTXr1Dz0OFF9zxUBnMWQEgQJdWAiwTmudI5SPC1zSFA7HOHnx92P9P4DE3v/xyVhODvbmEVnLmpXbj2dhfftT5IWK+1RK1mazrrFfNoMZbGgmhE9H6MJ13boj+KZR5tcV93g5SfHH5TaIcF71ltn/CsWh9vmbJ32cTUCAwEAAQ==\""
            buildConfigField "String", "STORE_NAME", "\"bazaar\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "ENABLE_DEBUG_LOGS", "false"
        }
        debug {
            buildConfigField "boolean", "ENABLE_DEBUG_LOGS", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //adivery
    implementation 'com.adivery:sdk:4.8.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.5.10'
}
// وابستگی‌های خاص هر flavor
dependencies {
    myketImplementation 'com.github.myketstore:myket-billing-client:1.6'
    bazaarImplementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
}											 